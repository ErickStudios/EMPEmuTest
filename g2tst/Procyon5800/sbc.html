<html>
<head>
    <style>
        button.buttona {
            background-color: #c0cd32;
            border-color: #868f21;
            border-radius: 10px;
            padding: 2px;
            margin: 4px;
        }
        button.buttonb {
            background-color: #4932cd;
            border-color: #21278f;
            border-radius: 10px;
            padding: 2px;
            margin: 4px;
        }
        input.abc {
            background-color: #c0cd32;
            border-color: #868f21;
            border-radius: 10px;
            padding: 2px;
        }
        button.onbutta {
            background-color: #635353;
            border-color: #383232;
            border-radius: 10px;
            padding: 4px;
        }
    </style>
</head>
<body>
    <script src="tb.js" type="module"></script>

    <div style="background-color: rgb(31, 31, 31); width: 350px; height: 290px">

        <canvas tabindex="0" id="videomem" width="96" height="72" style="padding: 5%; width: 90%; height: 67%; background-color: rgb(69, 69, 69); image-rendering: pixelated;"></canvas>

        <div style="display: flex; width: 92%; height: 35%; padding: 2%; padding-left: calc(52% - (100% / 2));">
            <div style="border-radius: 10px; border-color: rgb(111, 111, 111); border-style: solid; width: 100%; height: 30%; padding: 1%; background-color: rgb(35, 35, 35); display: flex;">
                <button class="onbutta" onclick="cpuReset();">BRK</button>
                <div style="display: flex; width: 70%; height: 90%; border-style: solid; border-color: rgb(69, 69, 69); border-radius: 1px; background-color: rgb(23, 23, 23);">
                    <button onclick="sendIonj(1);" class="buttona">A</button>
                    <button onclick="sendIonj(2);" class="buttona">B</button>
                        <input type="file" id="CardSdSelect" hidden>
                        <div style="margin: 2%; display: flex; width: 30%; height: 60%; border-style: solid; border-color: rgb(92, 92, 92); border-radius: 1px; background-color: rgb(66, 66, 66);">
                            <label for="CardSdSelect" class="buttona" style="cursor:pointer;">
                            CARD
                            </label>
                        </div>
                    <p id="cardName" style="width: 100%; margin: 0 auto; margin-top: 3%; color: #ffea00; font-family: monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;">NONE SELECTED IN CARD</p>
                    <button onclick="sendIonj(3);" class="buttona">X</button>
                    <button onclick="sendIonj(4);" class="buttona">Y</button>
                </div>
                <button onclick="sendIonj(10);" class="buttonb">V</button>
                <button onclick="sendIonj(12);" class="buttonb">N</button>
            </div>
        </div>
        
    </div>

    <div style="display: block;">
        <!--Logger-->
        <textarea id="debugLog" style="width: 300px; height: 200px; resize: none; color: green; background-color: black;" readonly></textarea>
        <textarea id="statar" style="width: 300px; height: 200px; resize: none; color: rgb(187, 187, 187); background-color: black;" readonly></textarea>
        <!--Button Area-->
        <div style="display: flex;">
            <!--Button Of Cpu Stepper-->
            <button onclick="step();">Step</button>
            <!--Button Of Pause Or Resume-->
            <button onclick="window.halted = !window.halted;">Run/Halt</button>

            <p id="regDbg"></p>
        </div>
    </div>
</body>
</html>
