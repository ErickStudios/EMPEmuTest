<html>
<head>
    <style>
        button.buttona {
            background-color: #c0cd32;
            border-color: #868f21;
            border-radius: 20px;
            font-size: 15px;
            padding: 1px;
            margin: 4px;
            margin-bottom: 2px;
        }
        button.buttonb {
            background-color: #4932cd;
            border-color: #21278f;
            border-radius: 10px;
            padding: 2px;
            margin: 2px;
        }
        button.buttong {
            background-color: #cd6832;
            border-color: #8f4f21;
            border-radius: 10px;
            padding: 2px;
            margin: 2px;
        }
        input.abc {
            background-color: #c0cd32;
            border-color: #868f21;
            border-radius: 20px;
            padding: 4px;
        }
        button.onbutta {
            background-color: #635353;
            border-color: #383232;
            border-radius: 10px;
            padding: 2px;
        }
    </style>
</head>
<body>
    <script src="tb.js" type="module"></script>

    <div id="console" style="margin-left: calc(50% - (550px / 2)); background-color: rgb(31, 31, 31); width: 550px; height: 490px">

        <div style="display: block; background-color: rgb(69, 69, 69);;">
            <canvas tabindex="0" id="videomem" width="96" height="72" style="margin: 5%; width: 90%; height: 67%; background-color: rgb(0, 0, 0); image-rendering: crisp-edges;"></canvas>
        </div>

        <div style="display: flex; width: 92%; height: 40%; padding: 2%; margin-top: 1%; padding-left: calc(54% - (100% / 2));">
            <div style="border-radius: 10px; border-color: rgb(111, 111, 111); border-style: solid; width: 100%; height: 30%; padding: 1%; background-color: rgb(35, 35, 35); display: block;">
                <div style="display: flex; width: 80%; height: 50%; padding-left: calc(50% - (70% / 2));">
                    <button onclick="sendIonj(10);" class="buttong">V</button>
                    <div style="display: flex; width: 70%; height: 90%; border-style: solid; border-color: rgb(69, 69, 69); border-radius: 1px; background-color: rgb(23, 23, 23);">
                        <button onclick="sendIonj(1);" class="buttona">A</button>
                        <button onclick="sendIonj(2);" class="buttona">B</button>
                            <input type="file" id="CardSdSelect" hidden>
                            <div style="margin: 0.45%; display: flex; width: 30%; height: 60%; border-style: solid; border-color: rgb(92, 92, 92); border-radius: 1px; background-color: rgb(66, 66, 66);">
                                <label for="CardSdSelect" class="buttona" style="cursor:pointer;">
                                CARD
                                </label>
                            </div>
                        <p id="cardName" style="width: 100%; margin: 0 auto; margin-top: 2.5%; color: #ffea00; font-family: monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;">NONE SELECTED IN CARD</p>
                        <button onclick="sendIonj(3);" class="buttonb">X</button>
                        <button onclick="sendIonj(4);" class="buttonb">Y</button>
                    </div>
                    <button onclick="sendIonj(12);" class="buttong">N</button>
                </div>
                <div style="width: 40%; height: 45%; padding-top: 1%; padding-left: calc(50% - 20%); display: flex;">
                    <button onclick="sendIonj(7);" class="buttonb">L</button>

                    <button onclick="sendIonj(5);" class="buttonb">W</button>
                    <button style="margin-left: 5%; width: 30%;" class="onbutta" onclick="cpuReset();">BRK</button>
                    <button style="margin-right: 5%; width: 20%;" class="buttong" onclick="cpuPau()">PAU</button>
                    <button onclick="sendIonj(6);" class="buttona">Z</button>
                    <button onclick="sendIonj(8);" class="buttona">J</button>

                </div>
            </div>
        </div>
        
    </div>

    <p>O = BRK</p>
    <p>F = FULL SCREEN</p>
    <p>K = LOCK POINTER</p>
    <p>E = EXPULSE CARD</p>
    <p>I = INSERT CARD</p>

    <div style="display: none;">
        <!--Logger-->
        <textarea id="debugLog" style="width: 300px; height: 200px; resize: none; color: green; background-color: black;" readonly></textarea>
        <textarea id="statar" style="width: 300px; height: 200px; resize: none; color: rgb(187, 187, 187); background-color: black;" readonly></textarea>
        <!--Button Area-->
        <div style="display: flex;">
            <!--Button Of Cpu Stepper-->
            <button onclick="step();">Step</button>
            <!--Button Of Pause Or Resume-->
            <button onclick="window.halted = !window.halted;">Run/Halt</button>

            <p id="regDbg"></p>
        </div>
    </div>
</body>
</html>
