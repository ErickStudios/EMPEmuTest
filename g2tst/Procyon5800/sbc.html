<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body {
            background: #0f0f0f;
            color: white;
            min-height: 90vh;
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
        }
        header {
            background: #6f865a;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            box-sizing: border-box;
        }
        p.imgLg {
            color: #cbedb3;
            margin: 0;
            font-size: 150%;
            font-weight: 700;
        }
        button.buttona {
            background: #c0cd32; border: 2px solid #868f21; border-radius: 20px; margin-top: 2px;
            width: 34px; height: 25px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 #5a5f16;
        }
        button.buttona:active { transform: translateY(2px); box-shadow: 0 1px 0 #5a5f16; }
        button.buttonb {
            background: #4932cd; border: 2px solid #21278f; border-radius: 10px; margin-top: 2px;
            width: 32px; height: 25px; color: white; cursor: pointer; box-shadow: 0 3px 0 #151a5e;
        }
        button.buttonb:active { transform: translateY(2px); box-shadow: none; }
        button.buttong {
            background: #51cd32; border: 2px solid #288f21; border-radius: 10px; margin-top: 2px;
            height: 25px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 #1a5f16;
        }
        button.buttong:active { transform: translateY(2px); box-shadow: none; }
        button.onbutta {
            background: #635353; border: 2px solid #383232; border-radius: 10px;
            min-width: 52px; height: 30px; color: #e9e9e9; font-weight: 700; cursor: pointer;
        }
        /* CARD0 Inverted Binary Braile Cylinder - 1 mm per bit */
        button.cardInserted {
            border-radius: 10px;
            background-color: #c7bb75;
            border-color: #c5c59a;
        }
        /* CARD0 no card */
        button.cardNoPresent {
            border-radius: 10px;
            border-style: solid;
            background-color: #1f1e1e;
            border-color: #0f0f0f;
        }
        #console {
            width: 560px; background: linear-gradient(180deg, #2a2a2a 0%, #1f1f1f 100%);
            border-radius: 28px; padding: 18px; border: 3px solid #3a3a3a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
  <header>
    <img src="../../markarianlog.png" style="width: 40px; height: 40px;">
    <p class="imgLg">Markarian</p>
    <span style="color:#cbedb3; font-size:90%;">hardware and software distributor of ErickCraftStudios</span>
  </header>

    <script src="tb.js" type="module"></script>

    <div id="console" style="margin: 0 auto; margin-top: 1%; background-color: rgb(31, 31, 31); width: 530px; height: 420px; padding-top: 2.5%; border-radius: 20px; box-shadow: #0f0f0f;">

        <div style="display: block; background-color: rgb(69, 69, 69); width: 90%; margin-left: calc(50% - (90% / 2)); margin-top: 0%;">
            <canvas tabindex="0" id="videomem" width="96" height="72" style="margin: 5%; width: 90%; height: 67%; background-color: rgb(0, 0, 0); image-rendering: pixelated;"></canvas>
        </div>

        <div style="display: flex; width: 92%; height: 60%; padding: 2%; margin-top: 0.05%; padding-left: calc(54% - (100% / 2));">
            <div style="border-radius: 10px; border-color: rgb(111, 111, 111); border-style: solid; width: 100%; height: 30%; padding: 1%; background-color: rgb(35, 35, 35); display: block;">
                <div style="display: flex; width: 80%; height: 50%; padding-left: calc(50% - (80% / 2));">
                    <button onclick="sendIonj(10);" class="buttong">V</button>
                    <div style="margin-inline: 10%; display: flex; width: 70%; height: 95%; border-style: solid; border-color: rgb(69, 69, 69); border-radius: 1px; background-color: rgb(23, 23, 23);">
                        <button onclick="sendIonj(1);" class="buttona">A</button>
                        <button onclick="sendIonj(2);" class="buttona">B</button>
                            <input type="file" id="CardSdSelect" hidden>
                            <div style="margin: 0.45%; display: flex; width: 60%; height: 75%; border-style: solid; border-color: rgb(92, 92, 92); border-radius: 10px; background-color: rgb(66, 66, 66);">
                                <p style="width: 10%; margin: 0; margin-left: 10%; margin-top: 2.5%; color: #e9e9e9; font-family: monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;">C0</p>
                                <button id="CardSdSelectStyle" class="cardNoPresent">.</button>
                            </div>
                        <button onclick="sendIonj(3);" class="buttonb">X</button>
                        <button onclick="sendIonj(4);" class="buttonb">Y</button>
                    </div>
                    <button onclick="sendIonj(12);" class="buttong">N</button>
                </div>
                <div style="width: 60%; height: 45%; padding-top: 1%; padding-left: calc(50% - (80% / 2)); display: flex;">
                    <button style="margin-right: 20%; width: 20%;" class="buttong" onclick="cpuPau()">PAU</button>
                    <button onclick="sendIonj(7);" class="buttonb">L</button>
                    <button onclick="sendIonj(5);" class="buttonb">W</button>
                    <button style="margin-left: 10%; margin-right: 10%; width: 40%;" class="onbutta" onclick="cpuReset();">BRK</button>
                    <button onclick="sendIonj(6);" class="buttona">Z</button>
                    <button onclick="sendIonj(8);" class="buttona">J</button>
                    <button style="margin-left: 15%;  width: 20%;" class="buttong" onclick="turboalt()">TRB</button>

                </div>
            </div>
        </div>
        
    </div>

    <div style="padding-top: 1%; text-align: center; margin: 0 auto; color: #51cd32; display: block;">
        <p style="margin-block: 0%;">O = BRK</p>
        <p style="margin-block: 0%;">E/I = EXPULSE CARD / INSERT CARD</p>
        <p style="margin-block: 0%;">M/F/K = MOUSE HIDE / FULL SCREEN / LOCK POINTER</p>
        <p style="margin-block: 0%;">A/B/X/Y/V/N/W/L/Z/J = HIS RESPECTIVE BUTTON</p>
        <button id="ShowInfo" class="buttong">DebugInfo</button>
        <script>
            const buttona = document.getElementById('ShowInfo');
            buttona.onclick = function() {
                const DbgState = document.getElementById('DbgState');
                let Showing = DbgState.style.display;

                if (Showing == 'none') {
                    Showing = 'block';
                }
                else Showing = 'none';

                DbgState.style.display = Showing;
            }
        </script>
    </div>
    <div id="DbgState" style=" display: none;">
        <!--Logger-->
        <textarea id="debugLog" style="width: 300px; height: 200px; resize: none; color: green; background-color: black;" readonly></textarea>
        <textarea id="statar" style="width: 300px; height: 200px; resize: none; color: rgb(187, 187, 187); background-color: black;" readonly></textarea>
        <!--Button Area-->
        <div style="display: flex;">
            <!--Button Of Cpu Stepper-->
            <button onclick="step();">Step</button>
            <!--Button Of Pause Or Resume-->
            <button onclick="window.halted = !window.halted;">Run/Halt</button>

            <p id="regDbg"></p>
        </div>
    </div>
</body>
</html>
