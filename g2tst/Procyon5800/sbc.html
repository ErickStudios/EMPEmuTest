<html>
<head>
    <style>
        button.buttona {
            background-color: #c0cd32;
            border-color: #868f21;
            border-radius: 20px;
            font-size: 15px;
            padding: 1px;
            margin: 4px;
            margin-bottom: 2px;
        }
        button.buttonb {
            background-color: #4932cd;
            border-color: #21278f;
            border-radius: 10px;
            padding: 2px;
            margin: 2px;
        }
        button.buttong {
            background-color: #51cd32;
            border-color: #288f21;
            border-radius: 10px;
            padding: 2px;
            margin: 2px;
        }
        input.abc {
            background-color: #c0cd32;
            border-color: #868f21;
            border-radius: 20px;
            padding: 4px;
        }
        button.onbutta {
            background-color: #635353;
            border-color: #383232;
            border-radius: 10px;
            padding: 2px;
        }
        /* CARD0 Inverted Binary Braile Cylinder - 1 mm per bit */
        button.cardInserted {
            border-radius: 10px;
            background-color: #c7bb75;
            border-color: #c5c59a;
        }
        /* CARD0 no card */
        button.cardNoPresent {
            border-radius: 10px;
            border-style: solid;
            background-color: #1f1e1e;
            border-color: #0f0f0f;
        }
        
    </style>
</head>
<body>
    <script src="tb.js" type="module"></script>

    <div id="console" style="margin: 0 auto; background-color: rgb(31, 31, 31); width: 550px; height: 490px; padding-top: 2%; border-radius: 20px; box-shadow: #0f0f0f;">

        <div style="display: block; background-color: rgb(69, 69, 69); width: 90%; margin-left: calc(50% - (90% / 2)); margin-top: 0.5%;">
            <canvas tabindex="0" id="videomem" width="96" height="72" style="margin: 5%; width: 90%; height: 67%; background-color: rgb(0, 0, 0); image-rendering: pixelated;"></canvas>
        </div>

        <div style="display: flex; width: 92%; height: 40%; padding: 2%; margin-top: 1%; padding-left: calc(54% - (100% / 2));">
            <div style="border-radius: 10px; border-color: rgb(111, 111, 111); border-style: solid; width: 100%; height: 30%; padding: 1%; background-color: rgb(35, 35, 35); display: block;">
                <div style="display: flex; width: 80%; height: 50%; padding-left: calc(50% - (70% / 2));">
                    <button onclick="sendIonj(10);" class="buttong">V</button>
                    <div style="display: flex; width: 70%; height: 90%; border-style: solid; border-color: rgb(69, 69, 69); border-radius: 1px; background-color: rgb(23, 23, 23);">
                        <button onclick="sendIonj(1);" class="buttona">A</button>
                        <button onclick="sendIonj(2);" class="buttona">B</button>
                            <input type="file" id="CardSdSelect" hidden>
                            <div style="margin: 0.45%; display: flex; width: 60%; height: 70%; border-style: solid; border-color: rgb(92, 92, 92); border-radius: 10px; background-color: rgb(66, 66, 66);">
                                <p style="width: 10%; margin: 0; margin-left: 10%; margin-top: 2.5%; color: #e9e9e9; font-family: monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;">C0</p>
                                <button id="CardSdSelectStyle" class="cardNoPresent">.</button>
                            </div>
                        <button onclick="sendIonj(3);" class="buttonb">X</button>
                        <button onclick="sendIonj(4);" class="buttonb">Y</button>
                    </div>
                    <button onclick="sendIonj(12);" class="buttong">N</button>
                </div>
                <div style="width: 60%; height: 45%; padding-top: 1%; padding-left: calc(50% - 30%); display: flex;">
                    <button style="margin-right: 5%; width: 20%;" class="buttong" onclick="cpuPau()">PAU</button>
                    <button onclick="sendIonj(7);" class="buttonb">L</button>
                    <button onclick="sendIonj(5);" class="buttonb">W</button>
                    <button style="margin-left: 5%; margin-right: 5%; width: 40%;" class="onbutta" onclick="cpuReset();">BRK</button>
                    <button onclick="sendIonj(6);" class="buttona">Z</button>
                    <button onclick="sendIonj(8);" class="buttona">J</button>
                    <button style="margin-left: 5%; width: 20%;" class="buttong" onclick="turboalt()">TRB</button>

                </div>
            </div>
        </div>
        
    </div>

    <div style="width: 100%; margin: 10 auto; text-align: center; padding-top: 2%;">
        <p style="margin: 0 auto; margin-bottom: 2%;">Or perhaps you were looking for a compiler for the EMP-200?</p>
        <a href="../../oasmc.html" style="color: white; margin: 1% auto; background-color: #3242cd; border-color: #21308f; border-radius: 5px; padding: 0.6%; padding-inline: 5%; border-style: solid;">Online Compiler</a>
    </div>

    <p>O = BRK</p>
    <p>F = FULL SCREEN</p>
    <p>K = LOCK POINTER</p>
    <p>E = EXPULSE CARD</p>
    <p>I = INSERT CARD</p>

    <div style="display: none;">
        <!--Logger-->
        <textarea id="debugLog" style="width: 300px; height: 200px; resize: none; color: green; background-color: black;" readonly></textarea>
        <textarea id="statar" style="width: 300px; height: 200px; resize: none; color: rgb(187, 187, 187); background-color: black;" readonly></textarea>
        <!--Button Area-->
        <div style="display: flex;">
            <!--Button Of Cpu Stepper-->
            <button onclick="step();">Step</button>
            <!--Button Of Pause Or Resume-->
            <button onclick="window.halted = !window.halted;">Run/Halt</button>

            <p id="regDbg"></p>
        </div>
    </div>
</body>
</html>
