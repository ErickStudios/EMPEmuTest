<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
  body {
    background: #0f0f0f;
    color: #c7bb75;
    font-family: 'JetBrains Mono', monospace;
    display: grid;
    place-items: center;
    min-height: 90vh;
  }
 .terminal {
    border: 2px solid #1f1e1e;
    border-radius: 16px;
    padding: 32px;
    background: #1a1a1a;
    box-shadow: 0 0 40px rgba(199,187,117,0.08), inset 0 0 0 1px #2a2a2a;
    width: min(600px, 90vw);
    text-align: center;
  }
  h1 { letter-spacing: -1px; margin: 0; color: #e8e0a0; }
  h1 span { color: #7571e6; }
  p { color: #635353; font-size: 13px; margin-top: 8px; }

  /* LA PASTILLA */
  #dropZone {
    margin-top: 28px;
    border: 2px dashed #2a2a2a;
    border-radius: 12px;
    padding: 40px 20px;
    cursor: pointer;
    transition: all 0.2s;
    background: #1f1e1e;
  }
  #dropZone:hover, #dropZone.dragover {
    background: #c7bb75;
    border-color: #c5c59a;
    color: #1f1e1e;
  }
  #dropZone:hover p, #dropZone.dragover p { color: #1f1e1e; }
  #dropZone b { display: block; font-size: 18px; }
  #status { margin-top: 16px; font-size: 12px; color: #7571e6; min-height: 18px; }

  button {
    all: unset;
    margin-top: 20px;
    background: #7571e6;
    color: white;
    border: 1px solid #36366d;
    border-radius: 10px;
    padding: 10px 24px;
    cursor: pointer;
    font-weight: 700;
  }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="terminal">
    <h1>EMP-<span>200</span> ONLINE ASM</h1>
    <p>GEN 2 ISA // CARD0 512B // 8-BIT BUS</p>

    <input type="file" id="SrcFs" hidden accept=".asm,.emp">
    <div id="dropZone">
      <b>[ INSERT CARD0 SOURCE ]</b>
      <p>Click o arrastra tu.asm aquí</p>
    </div>
    <div id="status">READY_</div>
  </div>

<script type="module">
import * as emp from "https://cdn.jsdelivr.net/gh/ErickStudios/EMP-Arch@72578d959d6312e3fd5f69bfc5e3fdb0509125c5/Toolchain/libemp.js?v=200"

const srcfs = document.getElementById('SrcFs');
const drop = document.getElementById('dropZone');
const status = document.getElementById('status');

function compileToRawBinaryBytes(textAsm) {
    return new Uint8Array(emp.g2asm.parseAsm(textAsm).result);
}

async function handleFile(file){
    if(!file) return;
    status.textContent = `COMPILING ${file.name}...`;
    try {
        const textAsm = await file.text();
        const rawBytes = compileToRawBinaryBytes(textAsm);
        status.textContent = `OK: ${rawBytes.length} BYTES -> ${file.name.replace(/\.asm$/i, '.bin')}`;

        const blob = new Blob([rawBytes], {type: 'application/octet-stream'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = file.name.replace(/\.asm$/i, '.bin'); a.click();
        setTimeout(()=> URL.revokeObjectURL(url), 2000);
    } catch(e) {
        status.textContent = `ASM ERROR: ${e.message}`;
        console.error(e);
    }
}

drop.onclick = () => srcfs.click();
srcfs.addEventListener('change', ev => handleFile(ev.target.files[0]));

// Drag & drop extra pro
drop.addEventListener('dragover', ev => { ev.preventDefault(); drop.classList.add('dragover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
drop.addEventListener('drop', ev => { ev.preventDefault(); drop.classList.remove('dragover'); handleFile(ev.dataTransfer.files[0]); });
</script>
</body>
</html>
